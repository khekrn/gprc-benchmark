# spring-rt runtime config. Env vars from scripts/config.sh, local defaults.

spring.application.name=spring-rt-bench
spring.main.banner-mode=off

# --- gRPC server (Netty) ---
spring.grpc.server.port=${LISTEN_PORT:50058}

# --- Reactive R2DBC datasource + pool ---
spring.r2dbc.url=r2dbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DB:bench}
spring.r2dbc.username=${PG_USER:bench}
spring.r2dbc.password=${PG_PASSWORD:bench}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=${PG_POOL_MIN:4}
spring.r2dbc.pool.max-size=${PG_POOL_MAX:16}
# r2dbc-postgresql prepares + caches statements per connection by default.

# --- Logging: lifecycle only, nothing per-RPC. ---
logging.level.root=INFO
logging.level.io.grpc=WARN
logging.level.io.netty=WARN
