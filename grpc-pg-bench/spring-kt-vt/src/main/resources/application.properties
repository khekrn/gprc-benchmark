# spring-kt-vt runtime config. All knobs come from the env vars exported by
# scripts/config.sh (same names every stack reads), with local defaults.

spring.application.name=spring-kt-vt-bench
spring.main.banner-mode=off

# --- gRPC server (Netty, plaintext) ---
spring.grpc.server.port=${LISTEN_PORT:50059}

# --- Virtual threads: gRPC request handlers run on virtual threads (the
#     explicit VT executor lives in GrpcServerConfig), so the blocking JDBC
#     calls park the carrier instead of pinning a platform thread.
spring.threads.virtual.enabled=true

# --- Datasource: blocking JDBC + HikariCP ---
# prepareThreshold=1 server-prepares statements from first use and the
# per-connection cache keeps them — mirrors pgx's statement cache.
# sslmode=disable: local/trusted PG, matches go-pgx and spring-vt.
spring.datasource.url=jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DB:bench}?sslmode=disable&prepareThreshold=1&preparedStatementCacheQueries=256
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASSWORD:sam}
# Pool sized from PG_POOL_MIN/MAX env for cross-stack fairness (do NOT inflate
# here — the high-concurrency tuning lives in the VT executor + gRPC/Netty
# knobs in GrpcServerConfig, not in an unfair pool).
spring.datasource.hikari.maximum-pool-size=${PG_POOL_MAX:16}
spring.datasource.hikari.minimum-idle=${PG_POOL_MIN:4}
# Pre-warm to minimum-idle at startup and keep connections alive so the first
# measured phase isn't taxed by lazy pool growth (mirrors the other stacks).
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-init-sql=SELECT 1

# --- Exposed (boot4 starter): never let it touch DDL — setup_db.sh owns the
#     schema. Generate-ddl is off by default; pinned here to be explicit. ---
spring.exposed.generate-ddl=false

# --- Logging: lifecycle only, nothing per-RPC. ---
logging.level.root=INFO
logging.level.io.grpc=WARN
logging.level.io.netty=WARN
