[package]
name    = "rust-tokio-bench"
version = "0.1.0"
edition = "2024"

# Rust side of the benchmark: tonic (gRPC) + tokio-postgres + deadpool pool.
# The logic is split across small modules under src/ (config, db, service,
# server, fnv, proto) so it reads cleanly against the Go and Kotlin stacks
# rather than living in one file.

[dependencies]
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic              = { version = "0.12", features = ["transport"] }
tonic-health       = "0.12"
prost              = "0.13"
tokio-postgres     = "0.7"
deadpool-postgres  = "0.14"
# Redis read-through cache for GetState (REDIS_ENABLED=true), the Rust twin of
# spring-vt's RedisStateCache / go-pgx's go-redis. redis-rs MultiplexedConnection
# is the closest analog to Lettuce's shared, pipelined single connection.
redis              = { version = "0.27", features = ["tokio-comp"] }
# Co-hosted REST /health, for fairness with spring-vt's co-hosted Jetty endpoint.
# axum 0.7 rides the same hyper 1.x + tokio that tonic 0.12 uses, so the gRPC and
# HTTP servers share one runtime (two surfaces contending for the 2 workers — the
# co-host cost we want to measure).
axum               = "0.7"
# Pin each tokio worker to a core (cache locality on the 2-core box). Gated by
# RUST_PIN_CORES; under taskset -c 2,3 the visible core set is just {2,3}.
core_affinity      = "0.8"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# In-process instrumentation profiler (no perf/root/kernel settings needed —
# fits this box's perf_event_paranoid=4). Optional + feature-gated so the
# shipped release build never pulls it in. Profile build:
#   cargo build --release --features hotpath
hotpath            = { version = "0.18", optional = true }

[features]
# Enables the #[hotpath::measure] / #[hotpath::main] instrumentation (the crate's
# own `hotpath` feature must be turned on, else the macros compile to no-ops).
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[build-dependencies]
tonic-build = "0.12"

[profile.release]
# Smaller binary, faster runtime — matches what we'd ship.
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = 3
panic         = "abort"
