# Tune the release build for the local CPU. The benchmark box is an x86_64
# AMD Ryzen; `target-cpu=native` lets LLVM use the host's full ISA (AVX2 etc.)
# since the binary only ever runs on the machine that built it. Harmless and
# equally correct on aarch64 (it would target the local ARM core instead).
[build]
rustflags = ["-C", "target-cpu=native"]
