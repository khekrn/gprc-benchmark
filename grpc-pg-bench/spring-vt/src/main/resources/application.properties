# spring-vt runtime config. All knobs come from the env vars exported by
# scripts/config.sh (same names every stack reads), with local defaults.

spring.application.name=spring-vt-bench
spring.main.banner-mode=off

# --- gRPC server (Netty, plaintext) ---
spring.grpc.server.port=${LISTEN_PORT:50056}

# --- REST server (Jetty servlet container) ---
# A SECOND network stack in the same JVM, on its own HTTP port. /health is a
# plain liveness endpoint (HealthController). Env-driven so the harness can move
# it; default 8080.
server.port=${HTTP_PORT:8080}

# ------------------------------------------------------------------------------
# Core Execution Architecture (Virtual Threads Enabled)
# ------------------------------------------------------------------------------
spring.threads.virtual.enabled=true

# ------------------------------------------------------------------------------
# Embedded Jetty Server Restrictions
# ------------------------------------------------------------------------------
# In Spring Boot 4.1, Virtual Threads route requests via Jetty's VirtualThreadPool.
# Setting max threads here acts as a semaphore boundary to prevent incoming
# HTTP bursts from generating unbound execution loops.
server.jetty.threads.max=16
server.jetty.threads.min=4

# ------------------------------------------------------------------------------
# Spring gRPC & Netty Native Epoll Fine-Tuning
# ------------------------------------------------------------------------------
# Netty I/O (worker) event-loop threads = 1 — the EFFECTIVE setting, read here by
# GrpcServerConfig (@Value("${NETTY_IO_THREADS:0}"); 0 => auto cores/2). One worker
# loop is the most CPU-efficient choice on the 2-vCPU box: a 2nd loop bounces
# connection/buffer state between the two cores' caches (IPC -6%, cache-misses +10%
# — see results/perf-cohost2-*). The boss/accept group is always 1. An OS env var
# of the same name overrides this (Spring orders the environment above this file),
# which is how the perf A/B forces 2 without editing here.
NETTY_IO_THREADS=1
# The two keys below are the Spring-gRPC-native properties for the same intent, but
# they are INERT in this app: GrpcServerConfig builds the event-loop groups itself
# (a ServerBuilderCustomizer) and that overrides property-based Netty config. Kept
# for documentation; NETTY_IO_THREADS above is what actually takes effect.
spring.grpc.server.netty.boss-threads=1
spring.grpc.server.netty.worker-threads=1

# Pooled direct buffers: NOTE this io.netty.* key is a Netty SYSTEM property and is
# inert in application.properties (Netty reads System.getProperty, which Spring does
# not feed). It actually takes effect via -Dio.netty.allocator.type=pooled in
# SPRING_VT_JVM_OPTS. Kept here for documentation.
io.netty.allocator.type=pooled

# ------------------------------------------------------------------------------
# Spring Framework 7 / Spring Boot 4.1 Micro-Optimizations
# ------------------------------------------------------------------------------
# Ensure rapid application context recovery and shutdown
spring.lifecycle.timeout-per-shutdown-phase=20s

# Disable high-overhead patterns that balloon memory footprints
spring.jpa.open-in-view=false

# --- Datasource: blocking JDBC + HikariCP ---
# prepareThreshold=1 server-prepares statements from first use and the
# per-connection cache keeps them — mirrors pgx's statement cache.
# sslmode=disable: local/trusted PG, matches go-pgx and quarkus-vt. (HikariCP
# reuses connections so SSL was never a hot path here, but kept consistent.)
# pgjdbc perf params (researched against jdbc.postgresql.org docs):
#  prepareThreshold=1            server-side prepared statements from first reuse
#  preparedStatementCacheQueries/SizeMiB  per-connection prepared cache (256 / 16 MiB)
#  binaryTransfer=true           bigint cols (seq/checksum/version/id) sent in binary, no text parse
#  assumeMinServerVersion=16     skip version-probe round trips at connection startup (PG is 16.x)
spring.datasource.url=jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DB:bench}?sslmode=disable&prepareThreshold=1&preparedStatementCacheQueries=256&preparedStatementCacheSizeMiB=16&binaryTransfer=true&assumeMinServerVersion=16
spring.datasource.username=${PG_USER:bench}
spring.datasource.password=${PG_PASSWORD:bench}
spring.datasource.hikari.maximum-pool-size=${PG_POOL_MAX:16}
spring.datasource.hikari.minimum-idle=${PG_POOL_MIN:4}

# --- Logging: lifecycle only, nothing per-RPC. ---
logging.level.root=INFO
logging.level.io.grpc=WARN
logging.level.io.netty=WARN
