# Application configuration
quarkus.application.name=grpc-quarkus-benchmark

# gRPC Server configuration
quarkus.grpc.server.port=50052
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.max-inbound-message-size=10485760
quarkus.grpc.server.max-inbound-metadata-size=8192

# HTTP configuration for metrics
quarkus.http.port=8081
quarkus.http.host=0.0.0.0

# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/benchmark
quarkus.datasource.username=benchmark
quarkus.datasource.password=password
quarkus.datasource.reactive.max-size=20

# Hibernate configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Logging configuration
quarkus.log.level=INFO
quarkus.log.category."com.benchmark".level=DEBUG
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# Metrics configuration
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# Health check configuration
quarkus.smallrye-health.root-path=/health

# Build time configuration
quarkus.package.type=jar
quarkus.native.additional-build-args=--allow-incomplete-classpath,--report-unsupported-elements-at-runtime

# Development configuration
%dev.quarkus.log.level=DEBUG
%dev.quarkus.datasource.reactive.url=postgresql://localhost:5432/benchmark

# Production configuration
%prod.quarkus.log.level=WARN
%prod.quarkus.datasource.reactive.url=${DATABASE_URL:postgresql://postgres:5432/benchmark}
