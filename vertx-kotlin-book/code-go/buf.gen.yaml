version: v2
clean: true
plugins:
  # Local plugins (installed via `go install`):
  #   google.golang.org/protobuf/cmd/protoc-gen-go
  #   google.golang.org/grpc/cmd/protoc-gen-go-grpc
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
