http:
  port: 8080
  host: 0.0.0.0

grpc:
  port: 9090

db:
  host: localhost
  port: 5432
  database: appdb
  user: app
  password: app
  pool:
    maxSize: 16        # rule of thumb: ~2-4 * CPU cores for non-blocking driver
    pipeliningLimit: 256
  schemaOnStartup: true

shutdownGracePeriodMs: 15000
